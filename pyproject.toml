[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is a style nit, not worth blocking CI on
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.google_photos_backup"]
