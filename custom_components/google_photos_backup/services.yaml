backup_now:
  name: Run backup now
  description: >-
    Immediately starts a backup run for the given Google Photos Backup
    config entry, regardless of the configured interval.
  fields:
    config_entry_id:
      name: Config entry
      description: The Google Photos Backup instance to sync.
      required: true
      selector:
        config_entry:
          integration: google_photos_backup

start_picker_session:
  name: Start photo picker session
  description: >-
    library_api backend only: creates a new Google Photos Picker session
    and sends a notification containing the link used to select photos and
    videos from the existing library. Whatever is selected there is backed
    up on the next sync (or via backup_now).
  fields:
    config_entry_id:
      name: Config entry
      description: The Google Photos Backup instance with backend "library_api".
      required: true
      selector:
        config_entry:
          integration: google_photos_backup
