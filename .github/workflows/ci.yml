name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Fast, zero-dependency-risk baseline: every .py file at least parses, and
  # every .json file (manifest, hacs.json, strings.json, translations) is
  # valid JSON. Catches the most common "silly mistake" class of PR before
  # spending time on the heavier hassfest/pytest jobs below.
  syntax-and-json:
    name: Syntax & JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile-check all Python files
        run: python3 -m compileall -q custom_components
      - name: Validate all JSON files
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          failed = False
          for path in pathlib.Path("custom_components").rglob("*.json"):
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as err:
                  print(f"INVALID: {path}: {err}")
                  failed = True
          if failed:
              sys.exit(1)
          print("All JSON files valid.")
          EOF
      - name: Check strings.json / translations are key-for-key in sync
        run: python3 tests/check_translations_sync.py
      - name: Check the source is English-only
        run: python3 tests/check_english_only.py

  hassfest:
    name: hassfest (official HA integration validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Complements hassfest rather than duplicating it: hassfest validates
  # the integration manifest, hacs/action validates the *repository* from
  # HACS' point of view (layout, hacs.json, brands entry, topics). This
  # integration ships exclusively as a HACS custom repository, so the
  # delivery path deserves its own check.
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  # Informational only (warns, never fails the run) - manifest.json's
  # version drifted for multiple functional PRs in a row before this was
  # added (see issue #10), and HACS' update detection relies on it (or a
  # git tag) changing. A warning here is a cheap nudge without blocking a
  # maintainer who's deliberately batching several PRs into one release.
  manifest-version-bump:
    name: manifest.json version bump reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if custom_components/ changed without a version bump
        run: |
          git fetch origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          if git diff --quiet "$BASE"...HEAD -- custom_components/; then
            echo "No changes under custom_components/ - nothing to check."
            exit 0
          fi
          if git diff --quiet "$BASE"...HEAD -- custom_components/google_photos_backup/manifest.json; then
            echo "::warning::custom_components/ changed but manifest.json wasn't - HACS won't notice this release unless the version (or a git tag) changes. Bump it before merging to master, or batch this into a version-bump PR later."
          else
            echo "manifest.json was touched - OK."
          fi

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests

  # Blocking as of #52: the run is clean, and mypy has already caught
  # real defects here that pytest/ruff/hassfest did not - a set-shadowing
  # bug in backends/base.py and an unguarded None dereference in the
  # reauth flow. Not --strict yet; see [tool.mypy] in pyproject.toml for
  # which checks are on.
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install mypy homeassistant
      - run: mypy custom_components/google_photos_backup

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest tests/ -v --cov=custom_components.google_photos_backup --cov-report=term-missing
